<!doctype html><html><body style="margin:0;width:1200px;height:900px;overflow:hidden;font-family:Arial;background:linear-gradient(#d8d3c8,#bdb6a8)">
<style>
.box{position:absolute;left:300px;top:90px;width:600px;height:720px;border-radius:26px;background:linear-gradient(160deg,#f4f5f6,#d9dcdf);box-shadow:20px 30px 60px #0005,inset 0 0 0 3px #c4c8cc}
.brand{position:absolute;left:50px;top:40px;font-weight:bold;font-size:30px;letter-spacing:2px;color:#2b4a7a}
.lcd{position:absolute;left:70px;top:130px;width:460px;height:250px;background:linear-gradient(#a7c6a0,#8fb488);border:10px solid #2d2f33;border-radius:10px;font-family:"Courier New",monospace;color:#1d2a1a;padding:22px;box-sizing:border-box}
.lcd b{display:block;font-size:44px;margin-bottom:10px}
.lcd span{display:block;font-size:30px;margin-top:6px}
.leds{position:absolute;left:90px;top:420px;display:flex;gap:46px;font-size:18px;color:#444;text-align:center}
.led{width:30px;height:30px;border-radius:50%;margin:0 auto 8px;background:#666}
.red{background:radial-gradient(#ff8a80,#e53935 60%,#8e1b18);box-shadow:0 0 25px #ff3b30}
.cables{position:absolute;left:180px;top:700px;width:240px;height:200px;display:flex;gap:40px}
.cables i{display:block;width:26px;height:220px;background:#111;border-radius:6px}
.cables i:nth-child(2){background:#b71c1c}
.btns{position:absolute;left:150px;top:560px;display:flex;gap:40px}
.btns div{width:70px;height:70px;border-radius:50%;background:#c7cacd;box-shadow:inset 0 -4px 0 #9a9ea2}
</style>
<div class="cables"><i></i><i></i><i></i><i></i></div>
<div class="box"><div class="brand">HYBRID INVERTER 10KW</div>
<div class="lcd"><b>FAULT  F07</b><span>Grid Over Voltage</span><span>Grid: 271 V</span><span>PV1: 0.0V  PV2: 0.0V</span></div>
<div class="leds"><div><div class="led"></div>PV</div><div><div class="led"></div>GRID</div><div><div class="led"></div>BAT</div><div><div class="led red"></div>FAULT</div></div>
<div class="btns"><div></div><div></div><div></div><div></div></div></div>
</body></html>
